[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas"
version = "1.0.0"
description = "Industrial sensor data quality scoring — C(v) = τ(T) × δ(n) × α(σ)"
requires-python = ">=3.12"
dependencies = [
    # Core
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "anthropic>=0.34",
    "openai>=1.10",
    # DB
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    # Cache / messaging
    "redis[asyncio]>=5.0",
    # Federated learning
    "flwr>=1.8",
    "torch>=2.2",
    "opacus>=1.4",
    "onnx>=1.16",
    # Marketplace
    "docker>=7.0",
    # MLflow
    "mlflow>=2.10",
    # Misc
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",   # for FastAPI TestClient
]
dev = [
    "veritas[api,test]",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "veritas_core*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
