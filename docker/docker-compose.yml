# =============================================================================
# PROJECT VERITAS â€” CLEAN STACK
# Version : 1.0.0
# Kafka   : KRaft mode â€” NO Zookeeper
# DB      : timescale/timescaledb:latest-pg16
# Airflow : 2.9.2 LocalExecutor â€” depends_on postgres with service_healthy
# =============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY must be set}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    # Fix: new DAGs start unpaused so veritas_enrichment_v1 is immediately active
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    # Fix: veritas_core mounted at /opt/airflow/veritas_core â€” needs /opt/airflow in path
    PYTHONPATH: "/opt/airflow"
    # Fix: DAGs use VERITAS_DB_URL; search_path enforced via options parameter
    VERITAS_DB_URL: "postgresql://veritas:${VERITAS_DB_PASSWORD:?}@postgres:5432/veritas?options=-csearch_path%3Dveritas%2Cpublic"
    # Legacy alias used by veritas_async_enrichment.py
    VERITAS_DB_CONN: "postgresql+psycopg2://veritas:${VERITAS_DB_PASSWORD:?}@postgres:5432/veritas?options=-csearch_path%3Dveritas%2Cpublic"
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    MINIO_ENDPOINT: "minio:9000"
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-veritas}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?}
    # Fix: install runtime deps not bundled in the base Airflow image
    _PIP_ADDITIONAL_REQUIREMENTS: "asyncpg>=0.29.0 psycopg2-binary>=2.9 anthropic>=0.25 minio>=7.2 boto3>=1.34"
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ../veritas_core:/opt/airflow/veritas_core   # importable as veritas_core
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - veritas_net

services:

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # TIMESCALEDB (PostgreSQL 16)
  # timescale/timescaledb:latest-pg16 â€” standard postgres lacks create_hypertable.
  # init-multiple-dbs.sh creates two databases: veritas + airflow.
  # sql/*.sql migrations run in lexicographic order inside the init script.
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: veritas_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: postgres
      VERITAS_DB_PASSWORD: ${VERITAS_DB_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/00_init_dbs.sh:ro
      - ../sql:/docker-entrypoint-initdb.d/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d veritas -c 'SELECT 1' -q 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    ports:
      - "5434:5432"    # 5432 and 5433 are used by other local services
    networks:
      - veritas_net
    restart: unless-stopped

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # KAFKA â€” KRaft mode, NO Zookeeper
  # confluentinc/cp-kafka:7.5.0 supports KRaft natively.
  # CLUSTER_ID must be a base64url-encoded UUID (generate once, commit it).
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: veritas_kafka
    environment:
      # KRaft identity
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be set}
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Tuning
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 536870912
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - veritas_net
    restart: unless-stopped

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # KAFKA INIT â€” pre-creates veritas.raw topic
  # Uses /bin/sh to ensure PATH is set correctly in the cp-kafka image.
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: veritas_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "export PATH=/usr/bin:$$PATH &&
       kafka-topics --bootstrap-server kafka:9092
         --create --if-not-exists
         --topic veritas.raw
         --partitions 4
         --replication-factor 1 &&
       echo 'topic veritas.raw ready'"
    networks:
      - veritas_net
    restart: "no"

  consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.consumer
    container_name: veritas_consumer
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
      VERITAS_DB_CONN: "postgresql://veritas:${VERITAS_DB_PASSWORD:?}@postgres:5432/veritas"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - veritas_net
    restart: unless-stopped
  monitoring-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.monitoring
    container_name: veritas_monitoring_api
    environment:
      VERITAS_DB_CONN: "postgresql://veritas:${VERITAS_DB_PASSWORD:?}@postgres:5432/veritas"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8888:8888"
    networks:
      - veritas_net
    restart: unless-stopped

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # MINIO â€” S3-compatible blob store for XCom paths and model artefacts
  # Rule 2: XCom carries path strings only, never DataFrames.
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  minio:
    image: minio/minio:latest
    container_name: veritas_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-veritas}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - veritas_net
    restart: unless-stopped

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # MINIO INIT â€” creates veritas-enrichment bucket
  # Runs once after MinIO is healthy then exits.
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  minio-init:
    image: minio/mc:latest
    container_name: veritas_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set veritas http://minio:9000 $${MINIO_ACCESS_KEY:-veritas} $${MINIO_SECRET_KEY} &&
        mc mb --ignore-existing veritas/veritas-enrichment &&
        echo 'bucket veritas-enrichment ready'
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-veritas}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?}
    networks:
      - veritas_net
    restart: "no"

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # AIRFLOW â€” init, webserver, scheduler
  # Both webserver and scheduler depend on postgres with service_healthy.
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  airflow-init:
    <<: *airflow-common
    container_name: veritas_airflow_init
    entrypoint: >
      bash -c "
        pip install --quiet asyncpg psycopg2-binary anthropic minio boto3 &&
        airflow db migrate &&
        airflow users create
          --username admin
          --firstname Veritas
          --lastname Admin
          --role Admin
          --email admin@veritas.local
          --password ${AIRFLOW_ADMIN_PASSWORD:-veritas2024} || true
      "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: veritas_airflow_web
    command: webserver
    ports:
      - "8081:8080"    # host:container â€” Docker Desktop uses 8080, so we use 8081 on host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: veritas_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # KAFKA UI â€” lightweight dev console
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: veritas_kafka_ui
    environment:
      KAFKA_CLUSTERS_0_NAME: veritas
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - veritas_net
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  minio_data:
  airflow_logs:

networks:
  veritas_net:
    driver: bridge
